name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test and Lint

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Step 3: Cache Poetry dependencies
      - name: Cache Poetry installation
        uses: actions/cache@4
        with:
          path: ~/.local
          key: poetry-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      # Step 4: Install Poetry
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -

      # Step 5: Configure Poetry
      - name: Configure Poetry
        run: |
          $HOME/.local/bin/poetry config virtualenvs.in-project true

      # Step 6: Cache virtual environment
      - name: Cache venv
        uses: actions/cache@4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-

      # Step 7: Install dependencies
      - name: Install dependencies
        run: |
          $HOME/.local/bin/poetry install

      # Step 8: Run Ruff linter
      - name: Lint with Ruff
        run: |
          $HOME/.local/bin/poetry run ruff check .
        continue-on-error: false

      # Step 9: Run unit tests
      - name: Run unit tests
        run: |
          $HOME/.local/bin/poetry run pytest tests/ -v --tb=short

      # Step 10: Run tests with coverage report
      - name: Generate coverage report
        run: |
          $HOME/.local/bin/poetry run pytest tests/ --cov=src --cov-report=term-with-missing --cov-report=html
        continue-on-error: true

      # Step 11: Upload coverage to artifacts (optional)
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # Ensure build status is clear
  build-status:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Build failed: Tests or linting did not pass"
            exit 1
          else
            echo "✅ Build passed: All tests and linting checks passed"
          fi
